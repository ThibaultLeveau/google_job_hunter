name: Backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
        env:
          POSTGRES_USER: job_hunter
          POSTGRES_PASSWORD: ci-fixture-only
          POSTGRES_DB: job_hunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_hunter -d job_hunter"
          --health-interval 2s --health-timeout 3s
          --health-retries 15 --health-start-period 10s
    env:
      TEST_DATABASE_URL: postgresql+psycopg://job_hunter:ci-fixture-only@127.0.0.1:5432/job_hunter
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          python-version: "3.14"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: backend-python314
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install locked dependencies
        id: dependencies
        run: uv sync --locked

      - name: Check formatting, lint and types
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked mypy

      - name: Verify single head and migrate empty database
        run: |
          uv run --locked python scripts/check_migration_heads.py
          JOB_HUNTER_DATABASE_URL="$TEST_DATABASE_URL" uv run --locked alembic upgrade head

      - name: Test with branch coverage
        id: tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          uv run --locked pytest --require-database --cov --cov-report=term-missing
          --cov-report=json:reports/coverage.json --cov-report=xml:reports/coverage.xml
          --junitxml=reports/junit.xml

      - name: Enforce independent coverage floors
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: uv run --locked python scripts/check_coverage.py reports/coverage.json

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/reports/
          retention-days: 7
          if-no-files-found: warn
