name: Containers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: containers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  container-quality:
    name: Container quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          python-version: "3.14"
          enable-cache: false
      - name: Build locked images and verify runtime and fixture pipeline
        shell: bash
        env:
          RUN_CONTAINER_TESTS: "1"
        run: |
          mkdir -p backend/reports
          uv run --directory backend --locked pytest tests/test_runtime.py -k container_runtime -q --tb=short 2>&1 | tee backend/reports/containers.log
      - name: Rehearse encrypted backup and restore
        shell: bash
        env:
          RUN_RECOVERY_TESTS: "1"
        run: |
          uv run --directory backend --locked pytest tests/test_recovery_rehearsal.py -q --tb=short 2>&1 | tee backend/reports/recovery.log
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/reports/containers.log
            backend/reports/recovery.log
          retention-days: 7
          if-no-files-found: warn
