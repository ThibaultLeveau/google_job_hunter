name: Browser

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-quality:
    name: Browser quality
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
        env:
          POSTGRES_USER: job_hunter
          POSTGRES_PASSWORD: ci-fixture-only
          POSTGRES_DB: job_hunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_hunter -d job_hunter"
          --health-interval 2s --health-timeout 3s
          --health-retries 15 --health-start-period 10s
    env:
      TEST_DATABASE_URL: postgresql+psycopg://job_hunter:ci-fixture-only@127.0.0.1:5432/job_hunter
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          python-version: "3.14"
          enable-cache: false

      - name: Install locked dependencies and Chromium
        run: |
          npm ci
          uv sync --directory ../backend --locked
          npx playwright install --with-deps chromium

      - name: Build and run real-stack browser smoke
        run: npm run test:e2e

      - name: Verify network, production and failure cleanup guards
        run: npm run test:e2e:guards

      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/reports/browser/
          retention-days: 3
          if-no-files-found: warn
