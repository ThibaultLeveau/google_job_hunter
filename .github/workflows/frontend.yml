name: Frontend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        id: dependencies
        run: npm ci

      - name: Set up uv and Python for schema export
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          python-version: "3.14"
          enable-cache: false

      - name: Install locked backend dependencies
        run: uv sync --directory ../backend --locked

      - name: Check lint and types
        run: |
          npm run lint
          npm run typecheck

      - name: Test with coverage floors
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:coverage

      - name: Build production bundle
        run: npm run build

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/reports/
          retention-days: 7
          if-no-files-found: warn
