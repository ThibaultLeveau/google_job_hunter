[project]
name = "job-hunter"
version = "0.1.0"
description = "Google Job Hunter API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "authlib==1.9.5",
    "cryptography==50.0.2",
    "dnspython==2.9.2",
    "email-validator==2.3.0",
    "fastapi==0.162.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "httpx2==2.16.0",
    "idna==3.20",
    "joserfc==1.8.0",
    "langchain-core==1.7.6",
    "langchain-openai==1.7.4",
    "langsmith==0.14.17",
    "openai==3.46.0",
    "protego==0.7.0",
    "psycopg[binary]==3.3.8",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "pypdf==6.21.4",
    "python-docx==1.2.0",
    "sqlalchemy==2.1.8",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "coverage==7.17.2",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers -p no:langsmith_plugin"
filterwarnings = [
    "error",
    # Pinned LangSmith uses this deprecated Python 3.14 API during import.
    "ignore:'asyncio.iscoroutinefunction' is deprecated.*:DeprecationWarning:langsmith._internal._beta_decorator",
]
markers = ["integration: requires TEST_DATABASE_URL pointing to disposable PostgreSQL"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "scripts", "tests", "migrations"]

[tool.coverage.run]
branch = true
source = ["src/job_hunter", "scripts", "migrations"]

[tool.coverage.report]
show_missing = true
exclude_lines = []
partial_branches = []

[tool.alembic]
script_location = "%(here)s/migrations"
