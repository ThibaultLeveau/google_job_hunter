[project]
name = "job-hunter"
version = "0.1.0"
description = "Google Job Hunter API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "email-validator==2.3.0",
    "fastapi==0.162.0",
    "psycopg[binary]==3.3.8",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.8",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "coverage==7.17.2",
    "httpx2==2.16.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]
markers = ["integration: requires TEST_DATABASE_URL pointing to disposable PostgreSQL"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "scripts", "tests", "migrations"]

[tool.coverage.run]
branch = true
source = ["src/job_hunter", "scripts", "migrations"]

[tool.coverage.report]
show_missing = true
exclude_lines = []
partial_branches = []

[tool.alembic]
script_location = "%(here)s/migrations"
